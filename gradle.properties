android.useAndroidX=true
# 开启 R8 full mode：更激进的类合并/内联/去虚拟化，混淆强度显著高于兼容模式
android.enableR8.fullMode=true
# 资源名混淆（需配合 shrinkResources，已在 build.gradle 开启）
android.enableResourceOptimizations=true
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/opt/aapt2-qemu/aapt2
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx1400m -Dfile.encoding=UTF-8
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk-arm64
org.gradle.parallel=false
org.gradle.daemon=false
